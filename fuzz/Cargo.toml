[package]
name = "backupforge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
backupforge-core = { path = "../crates/core" }
backupforge-common = { path = "../crates/common" }
serde_json = "1"

[workspace]

[[bin]]
name = "open_chunk"
path = "fuzz_targets/open_chunk.rs"
test = false
doc = false

[[bin]]
name = "repo_config"
path = "fuzz_targets/repo_config.rs"
test = false
doc = false

[[bin]]
name = "chunker"
path = "fuzz_targets/chunker.rs"
test = false
doc = false

[[bin]]
name = "open_blob"
path = "fuzz_targets/open_blob.rs"
test = false
doc = false
