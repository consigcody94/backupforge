[package]
name = "backupforge-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Backup, restore and verification for BackupForge"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
# Unfinished backup sources (SSH, Proxmox, Docker, databases, cloud VMs).
experimental-sources = ["dep:ssh2"]

[dependencies]
backupforge-common = { path = "../common", version = "0.1.0" }
backupforge-core = { path = "../core", version = "0.1.0" }
backupforge-storage = { path = "../storage", version = "0.1.0" }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# SSH support (experimental sources only)
ssh2 = { workspace = true, optional = true }

# File watching
walkdir = "2.5"
cap-std = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.10"
proptest = "1.12.0"
