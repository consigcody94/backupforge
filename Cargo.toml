[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/storage",
    "crates/agent",
    "crates/server",
    "crates/cli",
    "crates/mcp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BackupForge Contributors"]
license = "Apache-2.0"
repository = "https://github.com/consigcody94/backupforge"
homepage = "https://github.com/consigcody94/backupforge"
keywords = ["backup", "deduplication", "encryption", "cli"]
categories = ["command-line-utilities", "filesystem", "cryptography"]
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
aes-gcm = "0.11"
argon2 = "0.6"
sha2 = "0.11"
blake3 = "1.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
rpassword = "7.3"

# Compression
zstd = "0.14"
lz4 = "1.24"

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }

# SSH
ssh2 = "0.9"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.7"

# Testing
mockall = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
