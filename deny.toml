[graph]
# The optional `s3` feature pulls in the unmaintained rusoto SDK. It is off by
# default and not shipped, so it is excluded from the default policy check.
all-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

# winx is a Windows-only dependency of cap-std; its LLVM exception is permissive.
[[licenses.exceptions]]
crate = "winx"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
